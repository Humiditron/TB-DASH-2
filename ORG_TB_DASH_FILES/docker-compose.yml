version: '3.8'

services:
  # Web Dashboard
  webapp:
    image: ghcr.io/humiditron/tb-dash:latest
    container_name: humid1-webapp
    restart: unless-stopped
    ports:
      - "5000:80"
    environment:
      - VITE_APP_TITLE=${VITE_APP_TITLE:-HUMID1_OS}
      - VITE_APP_DESCRIPTION=${VITE_APP_DESCRIPTION:-Industrial Climate Telemetry & IoT Humidor Management}
      - VITE_APP_REDIRECT_URI=${VITE_APP_REDIRECT_URI:-}
      - VITE_THINGSBOARD_URL=${VITE_THINGSBOARD_URL:-https://app.humid1.com}
      - VITE_AUTHENTIK_URL=${VITE_AUTHENTIK_URL:-https://auth.humid1.com}
      - VITE_AUTHENTIK_CLIENT_ID=${VITE_AUTHENTIK_CLIENT_ID:-}
      - VITE_AUTHENTIK_APP_SLUG=${VITE_AUTHENTIK_APP_SLUG:-humid1-dash}

  # Caddy Reverse Proxy & SSL Automation
  caddy:
    image: caddy:alpine
    container_name: humid1-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - webapp

volumes:
  caddy_data:
  caddy_config:
